# auto detects a good number of processes to run
worker_processes auto;

#Provides the configuration file context in which the directives that affect connection processing are specified.
events {
    # Sets the maximum number of simultaneous connections that can be opened by a worker process.
    worker_connections 8000;
    # Tells the worker to accept multiple connections at a time
    multi_accept on;
}


http {
    # what times to include
    include       /etc/nginx/mime.types;
    # what is the default one
    default_type  application/octet-stream;

    # Sets the path, format, and configuration for a buffered log write
    log_format compression '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $upstream_addr '
        '"$http_referer" "$http_user_agent"';

    server_tokens off;

    server {
        # listen on port 80
        listen 80;
        # save logs here
        access_log /var/log/nginx/access.log compression;

        # where the root here
        root /usr/share/nginx/html;
        # what file to server as index
        index index.html index.htm;

        add_header Content-Security-Policy "connect-src 'self' https://*.fcalatam.com.br https://api-js.mixpanel.com/  https://*.amazonaws.com http://*.hotjar.com:* https://*.hotjar.com:* https://vc.hotjar.io:* https://surveystats.hotjar.io wss://*.hotjar.com; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://ssl.google-analytics.com https://api-js.mixpanel.com/ http://static.hotjar.com https://static.hotjar.com https://script.hotjar.com; img-src 'self' 'unsafe-inline' data: https://*.fiat.com.br/ https://*.jeep.com.br/ https://*.ram.com.br/ https://*.amazonaws.com https://script.hotjar.com http://script.hotjar.com; style-src 'self' 'unsafe-inline'; font-src 'self' https://themes.googleusercontent.com https://use.typekit.net http://script.hotjar.com https://script.hotjar.com; frame-src 'self' https://vars.hotjar.com;";

        add_header X-Content-Type-Options nosniff;
        
        add_header X-XSS-Protection "1; mode=block";

        add_header X-Frame-Options DENY always;

        location / {
            # First attempt to serve request as file, then
            # as directory, then fall back to redirecting to index.html
            try_files $uri $uri/ /index.html;
        }

        # Media: images, icons, video, audio, HTC
        location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
          expires 1M;
          access_log off;
          add_header Cache-Control "public";
        }

        # Javascript and CSS files
        location ~* \.(?:css|js|json)$ {
            try_files $uri =404;
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        # Any route containing a file extension (e.g. /devicesfile.js)
        location ~ ^.+\..+$ {
            try_files $uri =404;
        }
    }
}
