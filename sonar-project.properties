# ==============================================================================
# SONARQUBE - CONFIGURACOES DO PROJETO
#
# IMPORTANTE: sonar.host.url e sonar.token NAO devem ser definidos aqui.
# As credenciais sao injetadas pelo CI/CD via Vault (gitlab-ci.yml).
# ==============================================================================

sonar.sourceEncoding=UTF-8

# Analisar apenas o codigo-fonte (excluindo testes, assets, etc.)
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/public/**,**/*.json,**/*.md,**/*.yml,**/cypress/**,src/assets/**,**/__snapshots__/**,**/*.stories.js,**/*.stories.jsx

# Testes - TODO: Reativar quando jest estiver em uso
# sonar.test.inclusions=**/*.test.jsx,**/*.test.js,**/*.spec.js,**/*.spec.jsx
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
